type: vertical-stack
cards:
  - type: conditional
    conditions:
      - condition: state
        entity: binary_sensor.gdc_stangd
        state: "on"
    card:
      show_name: true
      show_icon: true
      type: button
      tap_action:
        action: toggle
        confirmation:
          text: Öppna garageport
      name: Garageport
      icon: mdi:garage-variant
      icon_height: 80px
      entity: cover.gdc_garageport
  - type: conditional
    conditions:
      - condition: state
        entity: binary_sensor.gdc_stangd
        state_not: "on"
    card:
      show_name: true
      show_icon: true
      type: button
      tap_action:
        action: toggle
        confirmation:
          text: Stäng garageport
      name: Garageport
      icon: mdi:garage-open-variant
      icon_height: 80px
      entity: cover.gdc_garageport
  - type: glance
    show_name: true
    show_icon: true
    show_state: false
    entities:
      - entity: binary_sensor.gdc_stangd
      - entity: binary_sensor.gdc_mellanlage
      - entity: binary_sensor.gdc_oppen
    state_color: true

# Garage door sensor configurations

# Garage door positions
binary_sensor:
  # Open position
  - platform: gpio
    name: Öppen
    id: gd_open_position
    pin:
      number: $gd_open_pos_pin
      inverted: true
      mode:
        input: true
        pullup: true
    filters:
      - delayed_on_off: 400ms
  # Closed position
  - platform: gpio
    name: Stängd
    id: gd_closed_position
    pin:
      number: $gd_closed_pos_pin
      inverted: true
      mode:
        input: true
        pullup: true
    filters:
      - delayed_on_off: 400ms
  # Intermediate position
  - platform: template
    name: Mellanläge
    id: gd_intermediate_position
    lambda: |-
      if ( id(gd_closed_position).state )
         return false;
      if ( id(gd_open_position).state )
         return false;
      return true;
  # External open/close switch
  - platform: gpio
    name: Manövrering
    id: gd_external_switch
    icon: mdi:light-switch
    pin:
      number: $gd_switch_pin
      inverted: false
      mode:
        input: true
        pulldown: true
    filters:
      - delayed_on_off: 400ms
#
# ESP32 Garage Door Controller
#
# https://github.com/jnasholm/gdc/tree/main
#
# Main configuration
#
substitutions:
  node_name: gdc
  node_prefix: GDC

# Define name, zone id and zone name
  gd_name: Garageport
  zone_id: garage
  zone_name: RK Garage

# Board configuration
esphome:
  project:
    name: "jnasholm.gdc"
    version: "0.1"
  name: $node_name
  friendly_name: $node_prefix
  comment: Garage Door Controller
  min_version: 2025.4.0

# Flash write interval
preferences:
  flash_write_interval: 20min

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: !secret hass_api_key

# Enable OTA
ota:
  - platform: esphome
    password: !secret ota_password

# Node switches
switch:
  - platform: restart
    name: Starta om nod
#  - platform: shutdown
#    name: Stäng av nod

# Node uptime
sensor:
  - platform: uptime
    name: Drifttid
    icon: mdi:timer-outline
    update_interval: 60s

# Include packages
packages:
  boardconfig: !include boardconfig.yaml
#  battery: !include battery.yaml
  time: !include time.yaml
  status: !include status.yaml
  controls: !include control-garage_door.yaml
  garage_door: !include sensors-garage_door.yaml
#  room_climate: !include sensors-room_climate.yaml

# Board configurations

# Olimex ESP32-C3-DevKit-Lipo
esp32:
  board:    esp32-c3-devkitm-1
  framework:
    type: esp-idf
packages:
  wifi: !include wifi.yaml
substitutions:
  # status.yaml
  system_led_pin:      GPIO7
  controller_led_pin:  GPIO8     # default on-board LED
  # control-garage_door.yaml
  gd_relay_pin:          GPIO6
  # sensors-garage_door.yaml
  gd_open_pos_pin:       GPIO1
  gd_closed_pos_pin:     GPIO2
  gd_switch_pin:         GPIO5
  # sensors-room_climate.yaml
  room_climate_sda_pin:  GPIO9
  room_climate_scl_pin:  GPIO10
  # battery.yaml
  battery_pin:         GPIO3
  charging_pin:        GPIO4
  battery_factor:      '1.784'   # 3.3V/3.7V*2.0, voltage divider (470+470)/470kohm
  charging_factor:     '1.468'   # 5.0V/5.0V*1.4681, voltage divider (220+470)/470kohm

